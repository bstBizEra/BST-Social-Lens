# Parser health — automated parser-REGRESSION + dependency/build-DRIFT detection.
#
# Runs on every PR/push to main (code regressions) and weekly on Monday 02:00 UTC
# = 09:00 Vientiane (drift: dependency updates, Node/TS changes). On a scheduled
# failure it opens — or comments on — a "parser-health" issue.
#
# This is NOT upstream payload-shape monitoring: CI only sees committed fixtures.
# A Meta/TikTok response-shape change is detected by the weekly manual step
# (AGENTS.md §3.8): side panel → "Raw payloads (NDJSON)" → tests/fixtures/_live/ →
# `npm run health`; promote a sanitised slice to tests/fixtures/*.json when it
# reveals a new shape.
#
# Third-party actions are SHA-pinned (tag noted beside each); permissions are
# read-only except the notify job.
name: parser-health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: extension · check / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Parser health (fixture replay with thresholds)
        run: npm run health
      - run: npm test
      - run: npm run build
      - run: npm run build:edge

  lens-api:
    name: lens-api · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/lens-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: services/lens-api
      - run: pytest -q
        working-directory: services/lens-api

  detect:
    name: detect optional components
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.p.outputs.worker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: p
        run: echo "worker=$([ -f services/lens-worker/requirements-dev.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  lens-worker:
    # Shown as SKIPPED (not green) when services/lens-worker is absent on this ref,
    # so a green run never implies the worker was tested.
    name: lens-worker · pytest
    needs: detect
    if: needs.detect.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: services/lens-worker
      - run: pytest -q
        working-directory: services/lens-worker

  notify:
    name: open issue on scheduled failure
    needs: [extension, lens-api, lens-worker]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = 'parser-health: weekly fixture replay failed';
            const body = [
              `Scheduled parser-health run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Jobs: ' + JSON.stringify(${{ toJSON(needs) }}, null, 0),
              '',
              'Next: export fresh raw payloads from the side panel, drop into tests/fixtures/_live/, run `npm run health`, and harden the parser (AGENTS.md §7 lessons log).',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'parser-health' });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['parser-health'] });
            }
