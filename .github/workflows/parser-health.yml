# Parser health — fixture replay + full gate.
#
# Runs on every PR/push to main (code regressions) and weekly on Monday 02:00 UTC
# = 09:00 Vientiane (drift check: dependency updates, Node/TS changes). On a
# scheduled failure it opens — or comments on — a "parser-health" issue so the
# breakage surfaces before the Console shows empty KPIs.
#
# What it cannot see: a Meta/TikTok payload-shape change is only visible with a
# fresh raw export. Weekly manual step (AGENTS.md §7): side panel → "Raw payloads
# (NDJSON)" → drop into tests/fixtures/_live/ → `npm run health`. Promote a
# sanitised slice to tests/fixtures/*.json when it reveals a new shape.
name: parser-health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: parser-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: extension · check / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Parser health (fixture replay with thresholds)
        run: npm run health
      - run: npm test
      - run: npm run build
      - run: npm run build:edge

  lens-api:
    name: lens-api · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/lens-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: services/lens-api
      - run: pytest -q
        working-directory: services/lens-api

  lens-worker:
    name: lens-worker · pytest (if present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f services/lens-worker/requirements-dev.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.present.outputs.yes == 'true'
        run: pip install -r requirements-dev.txt
        working-directory: services/lens-worker
      - if: steps.present.outputs.yes == 'true'
        run: pytest -q
        working-directory: services/lens-worker

  notify:
    name: open issue on scheduled failure
    needs: [extension, lens-api, lens-worker]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'parser-health: weekly fixture replay failed';
            const body = [
              `Scheduled parser-health run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Jobs: ' + JSON.stringify(${{ toJSON(needs) }}, null, 0),
              '',
              'Next: export fresh raw payloads from the side panel, drop into tests/fixtures/_live/, run `npm run health`, and harden the parser (AGENTS.md §7 lessons log).',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'parser-health' });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['parser-health'] });
            }
